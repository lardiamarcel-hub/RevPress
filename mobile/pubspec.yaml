name: revue_eco_bf
description: "Lecteur de flux RSS façon Feedly — presse économique du Burkina Faso, journaux et magazines locaux, sources régionales et internationales."
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Stockage local (aucun backend requis)
  sqflite: ^2.4.4
  path: ^1.9.0

  # Récupération et lecture des flux RSS/Atom
  http: ^1.2.0
  dart_rss: ^3.0.3
  html: ^0.15.4

  # State management
  provider: ^6.1.2

  # Utilitaires
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
