name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      # Le SDK Flutter n'est pas disponible dans l'environnement qui a généré
      # ce dépôt : les dossiers de plateforme (android/, ios/, ...) sont
      # générés ici, à la volée, à chaque build.
      - name: Générer les dossiers de plateforme
        working-directory: mobile
        run: flutter create --platforms=android --org bf.cci.revueecobf --project-name revue_eco_bf .

      - name: Retirer le test généré par défaut (ne correspond pas à cette app)
        run: rm -f mobile/test/widget_test.dart

      - name: Renommer l'application affichée sur le téléphone
        run: |
          sed -i 's/android:label="revue_eco_bf"/android:label="Revue Éco BF"/' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="Revue Éco BF"' mobile/android/app/src/main/AndroidManifest.xml || { echo "::error::app label patch failed"; cat mobile/android/app/src/main/AndroidManifest.xml; exit 1; }

      # Sans Firebase, plus aucun plugin natif n'apporte la permission INTERNET
      # via la fusion de manifeste (les plugins Firebase le faisaient). Le
      # manifeste "main" (utilisé en release) ne l'inclut pas par défaut —
      # seuls les manifestes debug/profile l'ont, pour l'observatoire Flutter.
      # Sans elle, tout accès réseau (ajout de flux, actualisation) échoue
      # silencieusement en release.
      - name: Ajouter la permission INTERNET (requise pour les flux RSS)
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.INTERNET"/>' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' mobile/android/app/src/main/AndroidManifest.xml || { echo "::error::INTERNET permission patch failed"; cat mobile/android/app/src/main/AndroidManifest.xml; exit 1; }

      - name: Installer les dépendances
        working-directory: mobile
        run: flutter pub get

      - name: Générer l'icône de l'application
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Analyser le code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Construire l'APK (release)
        working-directory: mobile
        run: flutter build apk --release

      - name: Renommer l'APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk revue-eco-bf.apk

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Revue Éco BF — build ${{ github.run_number }}"
          body: |
            APK généré automatiquement par GitHub Actions à partir de la branche `${{ github.ref_name }}`.

            Installation : téléchargez `revue-eco-bf.apk` sur votre téléphone Android, puis ouvrez le
            fichier (autorisez « Installer des applications inconnues » si Android le demande).
            L'application fonctionne entièrement sur le téléphone, sans compte ni serveur à
            configurer : ajoutez vos journaux et flux RSS directement depuis l'app.
          files: revue-eco-bf.apk
